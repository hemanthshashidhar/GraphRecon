[project]
name = "graphrecon"
version = "0.1.0"
description = "Dependency graph generator for web applications."
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "beautifulsoup4",
    "httpx",
    "networkx",
    "orjson",
    "playwright",
    "pydantic",
    "pydantic-settings>=2.14.2",
    "rich",
    "typer",
]

[project.scripts]
graphrecon = "graphrecon.cli.main:app"

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
python_version = "3.12"
strict = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
